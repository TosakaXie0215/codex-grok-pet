<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:;" />
    <title>Codex Pet · 表情</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0b0d;
        --ink: #f2f5f9;
        --muted: #7f8794;
        --card: rgba(255, 255, 255, 0.035);
        --line: rgba(255, 255, 255, 0.07);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(1100px 600px at 18% -10%, rgba(96, 120, 160, 0.14), transparent 60%),
          radial-gradient(900px 500px at 92% 110%, rgba(90, 105, 130, 0.1), transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        padding: 54px 56px 44px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 34px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-dot {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: radial-gradient(circle at 33% 28%, #5b6068, #16181b 58%, #050505);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 24px rgba(0, 0, 0, 0.5);
        position: relative;
      }
      .brand-dot::before,
      .brand-dot::after {
        content: "";
        position: absolute;
        top: 9px;
        width: 3.5px;
        height: 11px;
        border-radius: 2px;
        background: #fff;
      }
      .brand-dot::before {
        left: 10px;
        transform: rotate(14deg);
      }
      .brand-dot::after {
        right: 10px;
        transform: rotate(14deg);
      }
      h1 {
        margin: 0;
        font-size: 27px;
        letter-spacing: -0.02em;
        font-weight: 620;
      }
      h1 span {
        color: var(--muted);
        font-weight: 420;
        margin-left: 10px;
        font-size: 15px;
        letter-spacing: 0;
      }
      .sub {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.01em;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 4px;
      }
      .toggle {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink);
        font: inherit;
        font-size: 12.5px;
        letter-spacing: 0.02em;
        padding: 10px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: 0.18s ease;
      }
      .toggle:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.16);
      }
      .toggle[data-on="1"] {
        background: rgba(240, 247, 255, 0.94);
        color: #0b0c0e;
        border-color: transparent;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 8px 8px 18px;
        overflow: hidden;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .card:hover {
        background: rgba(255, 255, 255, 0.055);
        border-color: rgba(255, 255, 255, 0.13);
      }
      .card canvas {
        display: block;
        width: 230px;
        height: 230px;
        margin: 6px auto 0;
      }
      .meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 14px 0;
      }
      .name {
        font-size: 15px;
        font-weight: 560;
        letter-spacing: 0.01em;
      }
      .note {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 5px;
        letter-spacing: 0.01em;
      }
      .key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10.5px;
        color: #5d6572;
        letter-spacing: 0.04em;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #59606b;
        font-size: 11.5px;
        margin-top: 30px;
        letter-spacing: 0.02em;
      }
      footer .dotline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      footer .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8de2b0;
        box-shadow: 0 0 12px rgba(141, 226, 176, 0.8);
      }
      @media (max-width: 1100px) {
        body {
          padding: 36px 28px;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="brand">
          <div class="brand-dot"></div>
          <h1>Codex Pet<span>GrokBot 同款圆球</span></h1>
        </div>
        <p class="sub">一双白色小眼，会看你、会发呆、会工作，也会替你高兴。</p>
      </div>
      <div class="controls">
        <button class="toggle" id="live">播放动画</button>
      </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>
      <div class="dotline"><span class="live-dot"></span><span>眼睛即状态 · 跟随 Codex 自动切换</span></div>
      <div>非官方粉丝作品 · 灵感来自 xAI GrokBot</div>
    </footer>

    <script src="./orb/orb.js"></script>
    <script src="./gallery.js"></script>
  </body>
</html>
